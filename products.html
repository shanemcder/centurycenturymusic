<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Coming Soon — Century Century</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100svh; display: grid; place-items: center; background: #111; color: #f4f1eb; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    main { text-align: center; padding: 32px; }
    h1 { font-size: clamp(24px, 4vw, 38px); font-weight: 400; letter-spacing: -.055em; margin: 0 0 30px; }
    .rule { width: 44px; height: 1px; background: #555; margin: 0 auto 30px; }
    p { font-size: 13px; font-weight: 400; letter-spacing: .14em; color: #a6a39f; margin: 0; text-transform: lowercase; }
  </style>
</head>
<body>
  <main>
    <h1>century century</h1>
    <div class="rule" aria-hidden="true"></div>
    <p>coming soon</p>
  </main>
</body>
</html>
